<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A serverless to-do list application built with AWS Lambda, API Gateway, DynamoDB, and S3.">
    <title>Serverless To-Do List | AWS Cloud App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Ambient background glow -->
    <div class="ambient-glow"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header" id="app-header">
            <div class="header-content">
                <div class="logo-group">
                    <div class="logo-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                    </div>
                    <div>
                        <h1>TaskFlow</h1>
                        <p class="subtitle">Serverless To-Do List</p>
                    </div>
                </div>
                <div class="header-badge">
                    <span class="badge-dot"></span>
                    <span>AWS Powered</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Stats Bar -->
            <div class="stats-bar" id="stats-bar">
                <div class="stat-card">
                    <span class="stat-number" id="stat-total">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="stat-active">0</span>
                    <span class="stat-label">Active</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="stat-completed">0</span>
                    <span class="stat-label">Done</span>
                </div>
                <div class="stat-card">
                    <div class="progress-ring-container">
                        <svg class="progress-ring" width="40" height="40">
                            <circle class="progress-ring-bg" cx="20" cy="20" r="16"/>
                            <circle class="progress-ring-fill" id="progress-ring" cx="20" cy="20" r="16"/>
                        </svg>
                        <span class="progress-text" id="progress-text">0%</span>
                    </div>
                    <span class="stat-label">Progress</span>
                </div>
            </div>

            <!-- Input Section -->
            <div class="input-section" id="input-section">
                <form id="todo-form" class="todo-form">
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="16"/>
                            <line x1="8" y1="12" x2="16" y2="12"/>
                        </svg>
                        <input 
                            type="text" 
                            id="todo-input" 
                            placeholder="What needs to be done?" 
                            autocomplete="off"
                            required
                        >
                    </div>
                    <button type="submit" id="add-btn" class="btn-add">
                        <span>Add Task</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </button>
                </form>
            </div>

            <!-- Filter Tabs -->
            <div class="filter-tabs" id="filter-tabs">
                <button class="filter-btn active" data-filter="all" id="filter-all">All</button>
                <button class="filter-btn" data-filter="active" id="filter-active">Active</button>
                <button class="filter-btn" data-filter="completed" id="filter-completed">Completed</button>
            </div>

            <!-- Todo List -->
            <div class="todo-list-container">
                <!-- Loading State -->
                <div class="loading-state" id="loading-state">
                    <div class="loader">
                        <div class="loader-dot"></div>
                        <div class="loader-dot"></div>
                        <div class="loader-dot"></div>
                    </div>
                    <p>Loading tasks...</p>
                </div>

                <!-- Empty State -->
                <div class="empty-state hidden" id="empty-state">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                    </svg>
                    <h3>No tasks yet</h3>
                    <p>Add your first task to get started</p>
                </div>

                <!-- Error State -->
                <div class="error-state hidden" id="error-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <h3>Connection Error</h3>
                    <p id="error-message">Unable to reach the server.</p>
                    <button class="btn-retry" id="retry-btn" onclick="TodoApp.loadTodos()">
                        Retry
                    </button>
                </div>

                <!-- Todo List -->
                <ul class="todo-list" id="todo-list"></ul>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer" id="app-footer">
            <p>Built with <span class="footer-aws">AWS Lambda</span> · <span class="footer-aws">API Gateway</span> · <span class="footer-aws">DynamoDB</span> · <span class="footer-aws">S3</span></p>
        </footer>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
